    // Returns the version of Windows Internet Explorer or a -1
    // (indicating the use of another browser).
    function IsIE8Browser() {
        var RetrnVlu = -1;
        var UserAgent = navigator.userAgent;
        var RegulrExp = new RegExp("Trident\/([0-9]{1,}[\.0-9]{0,})");
        if (RegulrExp.exec(UserAgent) != null) {
            RetrnVlu = parseFloat(RegExp.$1);
        }
        return RetrnVlu;
    }
    function SafariVersion() {
        var RetrnVlu = -1;
        var UserAgent = navigator.userAgent;
        var RegulrExp = new RegExp("Version\/([0-9]{1,}[\.0-9]{0,})");
        if (RegulrExp.exec(UserAgent) != null) {
            RetrnVlu = parseFloat(RegExp.$1);
        }
        return RetrnVlu;
    }

    function fnHandleIsLoginRequired(xmlDoc){
       //alert("inside fnHandleIsLoginRequired()");
        var statusOperLoginReq;
        var statusOperSecLevel;
        statusOperLoginReq = getXpathValue(xmlDoc,"LoginRequired/Response/statusOfOperation");
        statusOperSecLevel = getXpathValue(xmlDoc,"GetSecurityConfiguration/Response/statusOfOperation");

        var loginMode = "";
        var secLevel = "";
       //alert(statusOperLoginReq)
        var status08 = getXpathValue(xmlDoc,"GetDiagnosticMode/Response/statusOfOperation");
        if(status08 == "Normal") {
            top.fnTrackCookie("DiagnosticMode","SET","9003", getXpathValue(xmlDoc,"DiagnosticMode/Category/MainCode/ValueList/Value/Value"));
        }
        //top.fnTrackCookie("DiagnosticMode","SET","9003", "1");
        if(statusOperLoginReq == AuthStatusConstants["STATUS_OK"] && statusOperSecLevel == AuthStatusConstants["STATUS_OK"]){
            top.fnSetCookie("LOGINSTATUS",null,-30);

            loginMode = getXpathValue(xmlDoc,"SecuritySettings/isLoginReqd");
            secLevel = getXpathValue(xmlDoc,"SecuritySettings/securityLevel");

            if(loginMode!="")
                top.fnSetClientCookie("retryCount",null, -30,"/");

            if(secLevel == "1"){
                top.fnSetCookie("SECURITYLEVEL","LOW");
            }
            else if(secLevel == "2"){
                top.fnSetCookie("SECURITYLEVEL","MODERATE");
            }
            else if(secLevel == "3"){
                top.fnSetCookie("SECURITYLEVEL","HIGH");
            }
            if(loginMode == "TRUE"){
                top.fnSetClientCookie("pageTrack","MAIN=LOGIN");
                fnRenderTopAccess("SECURED");
            }
            else if(loginMode == "FALSE"){
                top.fnSetCookie("LOGINMODE","NORMAL");
                top.fnSetClientCookie("pageTrack","MAIN=DEVICE");
                fnRenderTopAccess(null);
            }
            else if(loginMode == "NOT_INITIALIZED"){
                top.fnSetCookie("LOGINSTATUS","CreateAdmin");
                fnRenderTopAccess(null);
            }
            else{
                var getCount =  top.fnGetClientCookie("retryCount");
                getCount = (getCount == "" || getCount == null)?0:getCount;

                if(getCount<20){
                    top.fnSetClientCookie("retryCount",getCount++ +"");
                    fnIsLoginRequired();
                }
                else{
                    alert(fnGetLocaleString("103472", "Internal Error has occurred. Please try again."));
                    top.fnSetClientCookie("retryCount", null, -30, "/");
                }

               //alert("Error !! Invalid Security mode from the server");
            }
        }else{
            alert(fnGetLocaleString("103472","Internal Error has occurred. Please try again."))
           //alert("Error !! Security Mode or Security Level status of operation is invalid from the server");
        }
    }

function fnCaliforniaCheck()

    try {
        gblCWSCommandLibArray = ["<Mode><CheckCaliforniaMode></CheckCaliforniaMode></Mode>"];

    }catch(e){errHandler(e,'fnCaliforniaCheck()','ChangePwdCalifornia.js?v=1659400467ta',"")}
}

function fnCaliforniaCheckHandler(node)
    {
    var CaliforniaEnabled = getXpathValue(node, "CheckCaliforniaMode/californiaMode");
    var pageTrackCookie = top.fnGetClientCookie("pageTrack");
    var securityMode = top.fnGetCookie("LOGINMODE");
        if(CaliforniaEnabled == "true")
        {
           top.fnSetClientCookie("pageTrack","MAIN=CALIFORNIAMODE");
           fnRenderTopAccess("CALIFORNIAMODE");
        }
        else
        {
            if (pageTrackCookie == "" || pageTrackCookie == "default" || securityMode == "") 
            {
                fnIsLoginRequired();
            }
            else {
                fnRenderTopAccess(null);
            }
        }
    }
window.onload = function() {
    top.fnSetCookie("LocaleOrder", top.gblLocaleOrder);
    fnCaliforniaCheck();
