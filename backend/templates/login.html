<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập | GoPrinx Agent API</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f1f5f9;
        padding: 16px;
      }
      .login-container {
        width: 100%;
        max-width: 420px;
      }
      .login-card {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 20px;
        padding: 36px 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.15);
      }
      .brand-header {
        text-align: center;
        margin-bottom: 28px;
      }
      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 30px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.4);
        font-size: 13px;
        color: #818cf8;
        font-weight: 600;
        margin-bottom: 14px;
        letter-spacing: 0.5px;
      }
      .brand-title {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
      }
      .brand-sub {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.4;
      }
      .alert-error {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.4);
        border-radius: 10px;
        padding: 12px 14px;
        color: #fca5a5;
        font-size: 13px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        animation: shake 0.3s ease-in-out;
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #cbd5e1;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }
      .input-icon {
        position: absolute;
        left: 12px;
        font-size: 16px;
        color: #64748b;
        pointer-events: none;
      }
      .form-input {
        width: 100%;
        padding: 12px 14px 12px 38px;
        background: rgba(2, 6, 23, 0.6);
        border: 1px solid #334155;
        border-radius: 10px;
        color: #f8fafc;
        font-size: 14px;
        transition: all 0.2s ease;
        outline: none;
      }
      .form-input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        background: rgba(2, 6, 23, 0.85);
      }
      .toggle-pass {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        font-size: 16px;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s ease;
      }
      .toggle-pass:hover {
        color: #f8fafc;
      }
      .remember-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        font-size: 13px;
        color: #94a3b8;
      }
      .checkbox-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }
      .checkbox-label input[type="checkbox"] {
        accent-color: #6366f1;
        width: 16px;
        height: 16px;
        cursor: pointer;
      }
      .jwt-badge {
        font-size: 11px;
        padding: 2px 6px;
        background: rgba(99, 102, 241, 0.2);
        color: #a5b4fc;
        border-radius: 4px;
        font-weight: 600;
      }
      .btn-submit {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-submit:hover {
        background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
        box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        transform: translateY(-1px);
      }
      .btn-submit:active {
        transform: translateY(0);
      }
      .login-footer {
        text-align: center;
        margin-top: 24px;
        font-size: 12px;
        color: #64748b;
      }
      .login-footer a {
        color: #818cf8;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="brand-header">
          <div class="brand-badge">
            <span>🖨️ GoPrinx System</span>
          </div>
          <h1 class="brand-title">Agent API Portal</h1>
          <p class="brand-sub">Hệ thống Quản trị & Giám sát Thiết bị Trung tâm</p>
        </div>

        {% if error %}
        <div class="alert-error" role="alert">
          <span>⚠️</span>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login_page', next=next_url) }}" id="loginForm">
          <input type="hidden" name="next" value="{{ next_url or '' }}" />

          <div class="form-group">
            <label class="form-label" for="username">Tên đăng nhập / Email</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input
                id="username"
                name="username"
                type="text"
                class="form-input"
                placeholder="gox"
                value="{{ username or 'gox' }}"
                required
                autocomplete="username"
                autofocus
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Mật khẩu</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input
                id="password"
                name="password"
                type="password"
                class="form-input"
                placeholder="••••••"
                required
                autocomplete="current-password"
              />
              <button type="button" class="toggle-pass" id="togglePassword" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                👁️
              </button>
            </div>
          </div>

          <div class="remember-row">
            <label class="checkbox-label">
              <input type="checkbox" name="remember" value="1" checked />
              <span>Ghi nhớ đăng nhập (30 ngày)</span>
            </label>
            <span class="jwt-badge">JWT</span>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span>Đăng Nhập</span>
            <span>➔</span>
          </button>
        </form>

        <div class="login-footer">
          <p>agentapi.quanlymay.com &bull; Phiên làm việc bảo mật 30 ngày</p>
        </div>
      </div>
    </div>

    <script>
      (function() {
        const toggleBtn = document.getElementById('togglePassword');
        const passInput = document.getElementById('password');
        if (toggleBtn && passInput) {
          toggleBtn.addEventListener('click', function() {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.textContent = isPass ? '🙈' : '👁️';
            toggleBtn.title = isPass ? 'Ẩn mật khẩu' : 'Hiện mật khẩu';
          });
        }
      })();
    </script>
  </body>
</html>
