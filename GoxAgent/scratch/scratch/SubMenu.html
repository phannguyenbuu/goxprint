    var isAddrExists = false;

  function fnOnload() {
        gblSETRequestXMLArray = ["<DiagnosticMode><Category><Mode>08</Mode><MainCode><Code>8637</Code></MainCode></Category></DiagnosticMode>"]
        glbContentWebServerCmdArray = ["<GetDiagnosticMode><commandNode>DiagnosticMode</commandNode></GetDiagnosticMode>"];
        gblGETRequestXMLArray = ["<DiagnosticMode><Category><Mode>08</Mode><MainCode><Code>8637</Code></MainCode></Category></DiagnosticMode>"];
        gblBoolHandleRespArray = [true];
        gblHashMapArray = [null];
        calledFromPage = "Reg-SubMenu";
        InitiateServerRequest("SETCMDGET");

    }

    function fnOnloadRegSubMenuHandler(node) {
        var status8637 = getXpathValue(xmlDoc,"GetDiagnosticMode/Response/statusOfOperation");
        if (status8637 == "Normal") {
            diaVal8637 = getXpathValue(node, "DiagnosticMode/Category/MainCode[@MainCode='8637']/ValueList[@count='1']/Value[@index='1']/Value");
        }
        switchSubMenu('');
    }
    function switchSubMenu(subTabId,flag,clicked) {
        top.fnGetCookie("DUMMYVALUE");
        if(clicked == 1)
            top.fnSetClientCookie("clicked","1");
        tablist = "tdTemplate-tdAddressBook-tdMBox";
        anclist = "Template-AddressBook-MBox";
        var addressBkPerm = parent.frames[0].addressBkPerm;
        var isGuestUser = parent.frames[0].userRole==(gblRoleSep+"Guest"+gblRoleSep);
        var mailboxLink = (top.fnGetCookie("TA_SETTINGS").indexOf("~YES") != -1)? (fnChkPermission("FaxTransmission") == true ? "Installed":"NotInstalled") : "NotInstalled";
        //addressBkPerm = "NoRestriction";
        //addressBkPerm = "OnlyAdministrator";
        //mailboxLink = "Installed";
        var diaVal = top.fnTrackCookie("DiagnosticMode","GET","9337");
        if(isGuestUser == false && (diaVal == "0" || (diaVal == "1" && parent.frames[0].isAdminLoggedIn == true))){
            isTemplateExists = true;
            showDivs("tdTemplate");
        }
        //for checking  the AddressBookAccess permission.
        var addrBookRemoteAccess = top.fnGetCookie("ADDR_BOOK_REMOTE_PERM");
        var dia3683Val = top.fnTrackCookie("DiagnosticMode","GET","3683");
        //if(isGuestUser == false && (addressBkPerm == "NoRestriction" || (addressBkPerm == "OnlyAdministrator" && addrBookRemoteAccess == "AddressBookRemoteAccess"  && dia3683Val == "1") ||  dia3683Val == "0")){
        //if(isGuestUser == false && (!(dia3683Val == "0" && addressBkPerm == "OnlyAdministrator" && parent.frames[0].isAdminLoggedIn != true) || !(dia3683Val == "1" && addressBkPerm == "OnlyAdministrator" && addrBookRemoteAccess != "AddressBookRemoteAccess"))){
        if(isGuestUser == false){
            //if((dia3683Val == "0" && addressBkPerm == "OnlyAdministrator" && parent.frames[0].isAdminLoggedIn != true) || (dia3683Val == "1" && addressBkPerm == "OnlyAdministrator" && addrBookRemoteAccess != "AddressBookRemoteAccess"))
            if(addressBkPerm == "OnlyAdministrator" && addrBookRemoteAccess != "AddressBookRemoteAccess")
                isAddrExists = false;
            else {
                isAddrExists = true;

                if (isTemplateExists)
                    showDivs("addressbookpipe_id~tdAddressBook");
                else
                    showDivs("tdAddressBook");
            }
        }

      if  (! (top.fnGetCookie("SECURITYLEVEL")=="HIGH" && diaVal8637 == "0"  )) {
          if (mailboxLink == "Installed") {
              isMBoxExists = true;
              if (isAddrExists || isTemplateExists) {
                  showDivs("mailboxpipe_id~tdMBox");
              }
              else
                  showDivs("tdMBox");
          }
     }

        var pageTrackValue = top.fnGetClientCookie("pageTrack");
        if(subTabId==""){
            if(pageTrackValue==""){
                top.location.reload();
            }
            else{
                var splitValue = pageTrackValue.split("&")[1];
                if(splitValue== undefined){
                    if(isTemplateExists)
                        subTabId = "TEMPLATE";
                    else if(isAddrExists)
                        subTabId = "ADDRESSBOOK";
                    else if(isMBoxExists)
                        subTabId = "MBOX";
                    else
                        subTabId = 'TEMPLATE';
                    top.fnSetClientCookie("pageTrack","MAIN=REGISTRATION&SUB="+subTabId);
                }
                else{
                    subTabId = splitValue.split("=")[1];
                }
                if(!flag)
                    top.backspacePressed = false;
            }
        }else if(!flag){
            top.fnSetClientCookie("pageTrack","MAIN=REGISTRATION&SUB="+subTabId);
            top.backspacePressed = false;
        }
			
		if((subTabId == "TEMPLATE" && !isTemplateExists) || (subTabId == "ADDRESSBOOK" && !isAddrExists) || (subTabId == "MBOX" && !isMBoxExists)){
            top.fnSetClientCookie("pageTrack","MAIN=DEVICE");
            top.location.replace(window.location.protocol+"//"+((window.location.hostname.indexOf(":") != -1 && window.location.hostname.indexOf("]") == -1)?(("["+window.location.hostname+"]")+((window.location.port != "")? ":"+window.location.port : "" )) : window.location.host)+"/?MAIN=TOPACCESS");
        }
		applySubMenuStyles(subTabId);
            
    }
    function applySubMenuStyles(subTabId) {
        var arrtab = tablist.split("-");
        var arrAnc = anclist.split("-");

        if(anclist == "Template-AddressBook-MBox") {
            tempIndex = 0;
            addrIndex = 1;
            mBoxIndex = 2;
        } else if(anclist == "AddressBook-MBox") {
            addrIndex = 0;
            mBoxIndex = 1;
        } else if(anclist == "Template-MBox") {
            tempIndex = 0;
            mBoxIndex = 1;
        }

        var tabList= "TEMPLATE-ADDRESSBOOK-MBOX";
        var tabArray = tabList.split('-');
        for(var i=0;i<tabArray.length;i++){
            var tabObj = document.getElementById(arrtab[i]);
            if(tabObj==null)
                continue;
            if(tabObj.className == "clsSubMenuSelected")
            {
                document.getElementById(arrtab[i]).className = "clsSubMenu";
                document.getElementById(arrAnc[i]).className = "clsSubMenuLink";
            }
        }

        switch (subTabId) {
            case 'TEMPLATE' :
                /*if(document.getElementById("tdTemplate").style.display == "none"){
                    alert(fnGetLocaleString("101392","Please enter a valid value.")+"("+fnGetLocaleString("101961","URL")+")");
                    return;
                }*/
                document.getElementById(arrtab[tempIndex]).className = "clsSubMenuSelected"
                document.getElementById(arrAnc[tempIndex]).className = "clsSubMenuLinkSelected"
                break;
            case 'ADDRESSBOOK' :
                /*if(document.getElementById("tdAddressBook").style.display == "none"){
                    alert(fnGetLocaleString("101392","Please enter a valid value.")+"("+fnGetLocaleString("101961","URL")+")");
                    return;
                }*/
                document.getElementById(arrtab[addrIndex]).className = "clsSubMenuSelected"
                document.getElementById(arrAnc[addrIndex]).className = "clsSubMenuLinkSelected"
                break;
            case 'MBOX' :
                /*if(document.getElementById("tdMBox").style.display == "none"){
                    alert(fnGetLocaleString("101392","Please enter a valid value.")+"("+fnGetLocaleString("101961","URL")+")");
                    return;
                }*/
                document.getElementById(arrtab[mBoxIndex]).className = "clsSubMenuSelected"
                document.getElementById(arrAnc[mBoxIndex]).className = "clsSubMenuLinkSelected"
                break;
        }
        FunLoadSubMenu(subTabId);
    }

    function FunLoadSubMenu(subTabId) {
        if(subTabId == "TEMPLATE") {
            parent.frames[2].location.href = "/Registration/Template/TempGrpFrame.html?v=1659400467ta";
        }
        else if (subTabId == "ADDRESSBOOK") {
            parent.frames[2].location.href = "/Registration/AddressBook/AddrBook.html?v=1659400467ta";
        }
        else if(subTabId == "MBOX") {
            parent.frames[2].location.href = "/Registration/MailBox/MBoxFrame.html?v=1659400467ta";
        }
    }
