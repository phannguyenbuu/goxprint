        function fnbValidateLogin(AuthParam) {
            var lsPassword = window.document.frmLogin.elements["PASS"].value;
            var usrName = window.document.frmLogin.elements["USERNAME"].value;
            var domainName = "";
            if(document.getElementById("domain_id").style.display== "" ) {
                try{
                    // if there are no options in the dropdown we get exception.Handled with try catch
                    domainName = window.document.frmLogin.SELDOMAIN.options[window.document.frmLogin.SELDOMAIN.selectedIndex].value;
                }catch(e){
                    domainName = "";
                }
            }
            calledFromPage = "AdminLogin";
            if(AuthParam == "UserAuth") {
                DeptAuthEnable="UserAuth";
                var liSize = lsPassword.length;
                if(window.document.frmLogin.elements["USERNAME"].value == "" /*|| fnbValidateUserLoginFields(window.document.frmLogin.elements["USERNAME"])*/) {
                    alert(fnGetLocaleString("101400","Please enter valid username."));
                    window.document.frmLogin.elements["USERNAME"].select();
                    return false;
                }
                showDivs("authimg_id");
                window.document.frmLogin.elements["Login"].disabled=true;
                window.document.frmLogin.elements["Cancel"].disabled=true;

                // Call for Authentication
                top.fnTrackCookie("USERCRED","SET","USERNAME",usrName);
                setAuthenticateParams(usrName, lsPassword, domainName,null);
            }
            else {
                DeptAuthEnable="DeptAuth";
                var deptCode = window.document.frmLogin.elements["DEPTCODE"].value;
                deptCode=fnsTrim(deptCode);
                if((deptCode.length < 1 || deptCode.length > 63) ||  fnbValidateDepartmentPassword(deptCode))
                {
                    alert(fnGetLocaleString("101392","Please enter a valid value.")+"("+fnGetLocaleString("100481","Department Code")+")");
                    window.document.frmLogin.elements["DEPTCODE"].value="";
                    window.document.frmLogin.elements["DEPTCODE"].focus();
                    return;
                }
                showDivs("Deptauthimg_id");
                window.document.frmLogin.elements["Enter"].disabled=true;
                window.document.frmLogin.elements["CancelDept"].disabled=true;
                domainName=window.document.frmLogin.SELDOMAIN.options[window.document.frmLogin.SELDOMAIN.selectedIndex].value;
                setAuthenticateParams(usrName, lsPassword, domainName,deptCode);
            }

        }

        function fnbFocusonLoad() {

            return false;
        }

        function getWidthWindw() {
            if( typeof( window.innerWidth ) == 'number' ) {
                //Other than IE browsers.
                windowWidth = window.innerWidth;
            } else if( document.documentElement && ( document.documentElement.clientWidth || document.documentElement.clientHeight ) ) {
                //For IE 6 + browsers.
                windowWidth = document.documentElement.clientWidth;
            } else if( document.body && ( document.body.clientWidth || document.body.clientHeight ) ) {
                //For IE 4
                windowWidth = document.body.clientWidth;
            }
        }
        function fnKeyUp() {
            nn=(document.layers)?true:false;
            ie=(document.all)?true:false;
            function keyDown(e) {
                var evt=(e)?e:(window.event)?window.event:null;
                if(evt){
                    var key=(evt.charCode)?evt.charCode:
                            ((evt.keyCode)?evt.keyCode:((evt.which)?evt.which:0));
                    if(key == "13") {
                        window.document.frmLogin.elements["PASS"].blur();
                        if(document.forms[0].Login.disabled == false){
                            fnbValidateLogin("UserAuth");
                        }
                    }
                }
            }
            document.onkeydown=keyDown;
            if(nn) document.captureEvents(Event.KEYDOWN);
        }

        function fnKeyUpDeptCode() {
            nn=(document.layers)?true:false;
            ie=(document.all)?true:false;

            document.onkeydown=keyDown;
            if(nn) document.captureEvents(Event.KEYDOWN);
        }
        
        function fnGetAuthenType(){
            var loginMode = top.fnGetCookie("LOGINMODE");
            if(loginMode == "SECURED" || loginMode == ""){
                gblSETRequestXMLArray = ["<Authentication></Authentication>","<DiagnosticMode><Category><Mode>08</Mode><MainCode><Code>8720</Code></MainCode></Category></DiagnosticMode>"];
                glbContentWebServerCmdArray = ["<GetSettings><commandNode>Authentication/AuthenticationSettings</commandNode></GetSettings>","<GetDiagnosticMode><commandNode>DiagnosticMode</commandNode></GetDiagnosticMode>"];
                gblGETRequestXMLArray = ["<Authentication><AuthenticationSettings><AuthenticationType/></AuthenticationSettings></Authentication>","<Network><Services><DirectoryServices></DirectoryServices></Services></Network>","<Controller><Settings><AdminSystemSettings><Authentication><deptManagement/><NeedDeptInfo/></Authentication></AdminSystemSettings></Settings></Controller>","<DiagnosticMode></DiagnosticMode>"];
                gblBoolHandleRespArray = [true];
                gblHashMapArray = [null];
                calledFromPage="Login-AuthenticationSettings";
                InitiateServerRequest("SETCMDGET");
            }
        }
        function fnPopulateDomainDropDown(node,authenMode){
            var tagName = "";
            var searchNodetag = "";
            var defDropDownVal = "";
            if(authenMode == "WindowsDomain"){
               tagName = "Domain";
               searchNodetag = "domainName";
               defDropDownVal = ((temp=getXpathValue(node,"primaryDomainID"))=="" ||temp == null)?  '' : temp ;
            }
            else if(authenMode == "Ldap"){
               tagName = "Ldap";
               searchNodetag = "ldapServerID";
               defDropDownVal = ((temp=getXpathValue(node,"primaryLdapID"))=="" ||temp == null)?  '' : temp ;
            }
            //alert("defDropDownVal="+defDropDownVal)
            var domainList = node.getElementsByTagName(tagName);
            var domainName;
            var ldapName="";
            var globalIndex = "";
            var domainObj = document.frmLogin.SELDOMAIN;
            for (var i=0,j=0; i<domainList.length; i++){
                domainName = ((temp=getXpathValue(domainList[i],searchNodetag)) == "" || temp == null)?  "" : temp ;
                if(domainName !=""){
                    if(authenMode == "Ldap"){
                        if(domainName !="0"){
                            //var ldapIDAuthdom = ((temp=getXpathValue(node,"AuthenticationSettings/AuthenticationType/Ldap[@ID='"+defDropDownVal+"']/ldapServerID"))=="" ||temp == null)?  '' : temp ;
                            ldapName = ((temp=getXpathValue(node,"DirectoryServices/DirectoryService[@id='"+domainName+"']/name"))=="" ||temp == null)?  '' : temp ;
                            if(ldapName != ""){
                                domainObj.options[j]=new Option(ldapName,ldapName);
                                if(defDropDownVal-1 == i){
                                    domainObj.selectedIndex = j;
                                }
                                j++;
                            }
                        }
                    }else{
                        domainObj.options[j]=new Option(domainName,domainName);
                        if(defDropDownVal-1 == i){
                            domainObj.selectedIndex = j;
                        }
                        j++;
                     }
                }
            }

        }
        function fnHandleAuthenticationMode(node){
            if(getXpathValue(node,"statusOfOperation") != "STATUS_OK"){
                alert(fnGetLocaleString("103472","Internal Error has occurred. Please try again."));
                return;
            }
            IsdeptEnable=getXpathValue(node,"Controller/Settings/AdminSystemSettings/Authentication/deptManagement");
            RequiredDept=getXpathValue(node,"Controller/Settings/AdminSystemSettings/Authentication/NeedDeptInfo");
            var authenMode = getXpathValue(node,"AuthenticationSettings/AuthenticationType/authenticationName");
            top.fnSetCookie("AuthenticationType",authenMode);
            if(authenMode == "Kerberos" || authenMode == "WindowsDomain" || authenMode == "Ldap"){  //Kerberos && NTLM && WindowServer(NTLM)
                showDivs("gap_id");
                if(authenMode == "Ldap"){
                    //alert(document.getElementById("WebUI_Domain").innerHTML)
                    document.getElementById("WebUI_Domain").innerHTML = fnGetLocaleString("101048","LDAP Server");
                }
                showDivs("domain_id");
                fnPopulateDomainDropDown(node,authenMode);

            }
            if(window.document.frmLogin.elements.length >= 1) {
                window.document.frmLogin.elements["USERNAME"].focus();
            }
           var diag_8720_val = getXpathValue(node,"DiagnosticMode/Category/MainCode/ValueList/Value/Value");
           if(diag_8720_val == "1")
            document.getElementById("deptTD_id").innerHTML = '<input type=\"text\" SIZE=32 MAXLENGTH=63 NAME=\"DEPTCODE\" onkeydown=\"fnKeyUpDeptCode();\" style=\"width:221px;\">';


            //In "LocalAuthentication" && "Ldap" case , flow is normal.Domain is not required
        }

        function fnbtnCancel() {
            top.fnSetClientCookie("pageTrack", "MAIN=DEVICE");
            top.location.replace(window.location.protocol+"//"+((window.location.hostname.indexOf(":") != -1 && window.location.hostname.indexOf("]") == -1)?(("["+window.location.hostname+"]")+((window.location.port != "")? ":"+window.location.port : "" )) : window.location.host)+"/?MAIN=TOPACCESS");
