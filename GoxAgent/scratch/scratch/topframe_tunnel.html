function fnnLogoutClick() {
    tabId = "DEVICE";

function fnnLoginClick(){
    top.fnSetCookie("LOGINSTATUS","tmpUserAuthDisableLogin");

var topmenu ="";
var initabId = "";
function switchTab(tabId , flag) {
    top.fnGetCookie("DUMMYVALUE");
    topmenu = getQueryStringValue("MAIN","top");

    if(top.fnGetClientCookie("eFilingLogin")=="true"){
        top.fnSetClientCookie("eFilingLogin",null, -30,"/");
        top.location.reload();
    }
	
	

    if(topmenu!="TOPACCESS") {
        top.fnSetClientCookie("pageTrack", "MAIN=DEVICE");
        top.location.replace(window.location.protocol + "//" + ((window.location.hostname.indexOf(":") != -1 && window.location.hostname.indexOf("]") == -1) ? (("[" + window.location.hostname + "]") + ((window.location.port != "") ? ":" + window.location.port : "" )) : window.location.host) + "/?MAIN=TOPACCESS");
    }

    if (tabId == "" ) {
        var pageTrackValue = top.fnGetClientCookie("pageTrack");
        if(pageTrackValue==""){
            top.location.reload();
        }
        else{
            tabId = pageTrackValue.split("&")[0].split("=")[1];
        }
    }
    else if(!flag){
        top.fnSetClientCookie("pageTrack", "MAIN="+tabId);
    }

    applyTopMenuStyles(tabId);
}

function applyTopMenuStyles(tabId) {
    try{
        var tabList= "DEVICE-JOBS-LOGS-REGISTRATION-COUNTER-USERMGMT-ADMIN-ACCINFO";
        var tabArray = tabList.split('-');
        for(var i=0;i<tabArray.length;i++){
            var tabObj = document.getElementById(tabArray[i]);
            if(tabObj==null)
                continue;
            if(tabObj.className == "tab-selected")
            {
                document.getElementById(tabArray[i]).className = "tab";
                document.getElementById(tabArray[i]+"-tri-left").className = "triagle-left";
                document.getElementById(tabArray[i]+"-tri-right").className = "triagle-right";
                document.getElementById(tabArray[i]+"-anchor").className = "MenuLink";
            }
        }
        document.getElementById(tabId).className = "tab-selected";
        document.getElementById(tabId+"-tri-left").className = "triagle-left-selected";
        document.getElementById(tabId+"-tri-right").className = "triagle-right-selected";
        document.getElementById(tabId+"-anchor").className = "MenuSelectedLink";
    }catch(E){
        top.fnSetClientCookie("pageTrack", "MAIN=DEVICE");
        top.location.replace(window.location.protocol+"//"+((window.location.hostname.indexOf(":") != -1 && window.location.hostname.indexOf("]") == -1)?(("["+window.location.hostname+"]")+((window.location.port != "")? ":"+window.location.port : "" )) : window.location.host)+"/?MAIN=TOPACCESS");
    }
    // LOADING SUBMENU & CONTENTS
    if(tabId=="DEVICE") {
        parent.SubMenu.location = "/Device/devicesubmenu.html?v=1659400467ta";
        parent.frames[2].location = "/Device/Device.html?v=1659400467ta";
        top.backspacePressed = false;
    } else if(tabId=="ACCINFO") {
        getAuthSettingsForSyncUser("ACCINFO");
        top.backspacePressed = false;
        //parent.SubMenu.location = "/MyAccount/MyAcctSubMenu.html?v=1659400467ta";
        //parent.frames[2].location = "/MyAccount/MyAccountFrame.html?v=1659400467ta";
    } else if(tabId=="JOBS") {
        parent.SubMenu.location = "/Jobs/jobsubmenu.html?v=1659400467ta";
    } else if(tabId=="LOGS") {
        parent.SubMenu.location = "/logs/LogsSubMenu.html?v=1659400467ta";
    } else if(tabId=="REGISTRATION") {
        parent.SubMenu.location = "/Registration/RegistrationSubMenu.html?v=1659400467ta";
    } else if(tabId=="COUNTER") {
        parent.SubMenu.location = "/Counters/CounterSubMenu.html?v=1659400467ta";
    } else if(tabId == "USERMGMT") {
        getAuthSettingsForSyncUser("USERMGMT");
        //parent.SubMenu.location.replace("/usermanagement/UserMgmtSubMenu.html?v=1659400467ta");
    }
    else if(tabId == 'ADMIN') {
        parent.SubMenu.location = "/Administration/adminsubmenu.html?v=1659400467ta";
    }
}
function getPageTrackValue(ref){
    var pageTrackValue = top.fnGetClientCookie("pageTrack");
    switch(ref){
        case 'MAIN':
            ref = pageTrackValue.split("&")[0].split("=")[1];
            break;
        case 'SUB':
            ref = (pageTrackValue.split("&").length == 1)?"": (pageTrackValue.split("&")[1]).split("=")[1];
            break;
        default:
            ref = pageTrackValue.split("&")[0].split("=")[1];
            break;
    }
    return ref;

}

                 showDivs("efiling");

        var syncSetting = ((temp=getXpathValue(domObj,"Controller/Settings/MyMenu/DataManagementServer/SyncFunction"))=="" ||temp == null)?  '' : temp ; //enable or disable
        if(syncSetting === undefined || syncSetting === null || syncSetting === ""){
            syncSetting = "false";
        }
        top.fnSetCookie("SYNCHOME",syncSetting);

        //var diaVal = top.fnTrackCookie("DiagnosticMode","GET","9337");
        //diaVal = "1"
        //addressBkPerm = "OnlyAdministrator"
        /*if(addressBkPerm == "NoRestriction" || (addressBkPerm == "OnlyAdministrator" && top.fnGetCookie("USERROLE").indexOf(gblRoleSep+"Administrator"+gblRoleSep) !=-1 ) || fax == "Installed" || diaVal == "0" || (diaVal == "1" && top.fnGetCookie("USERROLE").indexOf(gblRoleSep+"Administrator"+gblRoleSep) !=-1 )){
            showDivs("REGISTRATION");
        }*/

        /*var approved = getXpathValue(domObj,"Controller/Settings/API/AppSettings/approved");
        top.fnSetCookie("AppSettings_Approved", approved);*/

    }catch(e){errHandler(e,'fnHandleTopAccessSettings()','TopMenu.html?v=1659400467ta',"");}
}
function fnHandleGetDiagnosticMode(domObj){
    //alert("TopMenu---->inside fnHandleGetDiagnosticMode222");
    var mainCodeList;// = domObj.getElementsByTagName('MainCode');
	var categoryList = domObj.getElementsByTagName('Category');
    var openCode;
    var openCodeList;
    var valueList;
    var values;
    var value;
	var mode;
	var temp;
    var strDiagCode="";
	for (var j=0;j<categoryList.length ;j++ )
	{	mode = ((temp = getXpathValue(categoryList[j],"Mode")) == "" || temp == null)? "&nbsp;" : temp;
		mainCodeList = categoryList[j].getElementsByTagName('MainCode');
		for(var i=0; i < mainCodeList.length; i++ ) {
			if(mode == "08") { 
				openCodeList = mainCodeList[i].getElementsByTagName("Code");
				openCode=  (!openCodeList[0].hasChildNodes())? 0 : openCodeList[0].childNodes[0].nodeValue;
			}
			else {
				openCodeList = mainCodeList[i].getElementsByTagName("OpenCode");
				openCode=  (!openCodeList[0].hasChildNodes())? 0 : openCodeList[0].childNodes[0].nodeValue;
			}			
			valueList = mainCodeList[i].getElementsByTagName('ValueList');
			if(valueList !=null && valueList !=undefined && valueList.length> 0){
				if (valueList[0].hasChildNodes()) {
					values =     valueList[0].childNodes;
					value=  (!values[0].getElementsByTagName("Value")[0].hasChildNodes())? 0 : values[0].getElementsByTagName('Value')[0].childNodes[0].nodeValue;
					//top.fnTrackCookie("DiagnosticMode","SET",openCode,value);
                    strDiagCode+=","+openCode+":"+value;
					 //alert("openCode "+openCode+" value "+value);
				}
			}
		}
	}
    if(strDiagCode != "") {
        top.fnSetCookie("DiagnosticMode",strDiagCode+",");
    }
    //top.fnTrackCookie("DiagnosticMode","SET","9003", "1");
}
