<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0505"/>
      <stop offset="100%" style="stop-color:#2D0A0A"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF2A2A"/>
      <stop offset="100%" style="stop-color:#CC0000"/>
    </linearGradient>

    <linearGradient id="redHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2A2A"/>
      <stop offset="100%" style="stop-color:#CC0000"/>
    </linearGradient>

    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2A0808"/>
      <stop offset="100%" style="stop-color:#1A0404"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="redglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 H8 M12 10 H20 M10 0 V8 M10 12 V20" stroke="#FF2A2A" stroke-width="0.3" opacity="0.1"/>
      <circle cx="10" cy="10" r="1" fill="none" stroke="#FF2A2A" stroke-width="0.3" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="url(#bg)"/>
  <rect width="200" height="200" rx="28" fill="url(#grid)"/>

  <!-- Outer border -->
  <rect x="2" y="2" width="196" height="196" rx="26" fill="none"
        stroke="url(#redGrad)" stroke-width="1.5" opacity="0.6" filter="url(#softglow)"/>

  <!-- Corner brackets -->
  <path d="M16 6 L6 6 L6 16"   fill="none" stroke="#FF2A2A" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M184 6 L194 6 L194 16" fill="none" stroke="#FF2A2A" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M16 194 L6 194 L6 184" fill="none" stroke="#FF2A2A" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M184 194 L194 194 L194 184" fill="none" stroke="#FF2A2A" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>

  <!-- ═══════════════════════════ -->
  <!--       ROBOT HEAD           -->
  <!-- ═══════════════════════════ -->

  <!-- Antenna -->
  <line x1="100" y1="28" x2="100" y2="18" stroke="#FF2A2A" stroke-width="2" stroke-linecap="round" filter="url(#softglow)"/>
  <circle cx="100" cy="14" r="5" fill="#FF2A2A" filter="url(#glow)"/>
  <circle cx="100" cy="14" r="9"  fill="none" stroke="#FF2A2A" stroke-width="0.9" opacity="0.35"/>
  <circle cx="100" cy="14" r="13" fill="none" stroke="#FF2A2A" stroke-width="0.5" opacity="0.15"/>

  <!-- Head -->
  <rect x="60" y="28" width="80" height="54" rx="12" fill="url(#headGrad)" stroke="url(#redGrad)" stroke-width="2" filter="url(#softglow)"/>

  <!-- Left ear -->
  <rect x="52" y="38" width="9" height="18" rx="4" fill="url(#headGrad)" stroke="#FF2A2A" stroke-width="1.2"/>
  <circle cx="56.5" cy="47" r="2.5" fill="#FF2A2A" filter="url(#softglow)"/>

  <!-- Right ear -->
  <rect x="139" y="38" width="9" height="18" rx="4" fill="url(#headGrad)" stroke="#FF2A2A" stroke-width="1.2"/>
  <circle cx="143.5" cy="47" r="2.5" fill="#FF2A2A" filter="url(#softglow)"/>

  <!-- Left eye -->
  <rect x="68" y="38" width="24" height="18" rx="5" fill="#0D0000" stroke="#FF2A2A" stroke-width="1.5"/>
  <rect x="71" y="41" width="18" height="12" rx="3" fill="url(#redGrad)" opacity="0.7" filter="url(#softglow)"/>
  <line x1="71" y1="45" x2="89" y2="45" stroke="white" stroke-width="0.8" opacity="0.4"/>
  <line x1="71" y1="49" x2="89" y2="49" stroke="white" stroke-width="0.8" opacity="0.25"/>
  <circle cx="80" cy="47" r="3.2" fill="white" opacity="0.95"/>
  <circle cx="81" cy="46" r="1.2" fill="#0D0000"/>

  <!-- Right eye -->
  <rect x="108" y="38" width="24" height="18" rx="5" fill="#0D0000" stroke="#FF2A2A" stroke-width="1.5"/>
  <rect x="111" y="41" width="18" height="12" rx="3" fill="url(#redGrad)" opacity="0.7" filter="url(#softglow)"/>
  <line x1="111" y1="45" x2="129" y2="45" stroke="white" stroke-width="0.8" opacity="0.4"/>
  <line x1="111" y1="49" x2="129" y2="49" stroke="white" stroke-width="0.8" opacity="0.25"/>
  <circle cx="120" cy="47" r="3.2" fill="white" opacity="0.95"/>
  <circle cx="121" cy="46" r="1.2" fill="#0D0000"/>

  <!-- Mouth -->
  <rect x="72" y="62" width="56" height="12" rx="5" fill="#0D0000" stroke="#FF2A2A" stroke-width="1.2"/>
  <rect x="75"  y="65" width="8"  height="6" rx="2" fill="#FF2A2A" opacity="0.9"/>
  <rect x="86"  y="65" width="8"  height="6" rx="2" fill="white"   opacity="0.8"/>
  <rect x="97"  y="65" width="8"  height="6" rx="2" fill="#FF2A2A" opacity="0.9"/>
  <rect x="108" y="65" width="8"  height="6" rx="2" fill="white"   opacity="0.6"/>
  <rect x="119" y="65" width="6"  height="6" rx="2" fill="#FF2A2A" opacity="0.5"/>

  <!-- Neck -->
  <rect x="90" y="82" width="20" height="10" rx="3" fill="#200808" stroke="#FF2A2A" stroke-width="1"/>

  <!-- ═══════════════════════════ -->
  <!--       PRINTER BODY         -->
  <!-- ═══════════════════════════ -->

  <!-- Paper output (white sheet) -->
  <rect x="68" y="88" width="64" height="22" rx="2" fill="white" opacity="0.97"/>
  <!-- Subtle paper lines -->
  <line x1="74" y1="94" x2="126" y2="94" stroke="#e0e0e0" stroke-width="0.8"/>
  <line x1="74" y1="99" x2="126" y2="99" stroke="#e0e0e0" stroke-width="0.8"/>
  <line x1="74" y1="104" x2="126" y2="104" stroke="#e0e0e0" stroke-width="0.8"/>
  <!-- Scan line -->
  <line x1="68" y1="97" x2="132" y2="97" stroke="#FF2A2A" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3" filter="url(#softglow)"/>
  <!-- Check mark on paper -->
  <polyline points="78,100 85,108 110,90" fill="none" stroke="#CC0000" stroke-width="3.2"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Printer top slot -->
  <rect x="58" y="108" width="84" height="10" rx="3" fill="#0D0000" stroke="#FF2A2A" stroke-width="1.2"/>

  <!-- Printer main body -->
  <rect x="54" y="117" width="92" height="42" rx="8" fill="url(#headGrad)" stroke="url(#redGrad)" stroke-width="1.8" filter="url(#softglow)"/>

  <!-- Ventilation slits -->
  <line x1="64" y1="127" x2="90" y2="127" stroke="#FF2A2A" stroke-width="1" opacity="0.3"/>
  <line x1="64" y1="132" x2="90" y2="132" stroke="#FF2A2A" stroke-width="1" opacity="0.3"/>
  <line x1="64" y1="137" x2="90" y2="137" stroke="#FF2A2A" stroke-width="1" opacity="0.3"/>

  <!-- LED progress bar -->
  <rect x="98" y="124" width="38" height="6" rx="3" fill="#0D0000" stroke="#FF2A2A" stroke-width="0.8"/>
  <rect x="99" y="125" width="26" height="4" rx="2" fill="url(#redHoriz)" opacity="0.9" filter="url(#softglow)"/>

  <!-- Button 1 — power -->
  <circle cx="107" cy="139" r="5" fill="#0D0000" stroke="#FF2A2A" stroke-width="1.3"/>
  <circle cx="107" cy="139" r="2.5" fill="#FF2A2A" opacity="0.9" filter="url(#softglow)"/>

  <!-- Button 2 — scan -->
  <circle cx="122" cy="139" r="5" fill="#0D0000" stroke="white" stroke-width="1.3"/>
  <circle cx="122" cy="139" r="2.5" fill="white" opacity="0.8"/>

  <!-- Button 3 — check/ok -->
  <circle cx="137" cy="139" r="5" fill="#0D0000" stroke="#FF2A2A" stroke-width="1.3"/>
  <polyline points="134,139 136.5,141.5 140.5,136" fill="none" stroke="#FF2A2A" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data flow dots -->
  <circle cx="93"  cy="92"  r="1.5" fill="#FF2A2A" opacity="0.8" filter="url(#softglow)"/>
  <circle cx="93"  cy="97"  r="1.5" fill="#FF2A2A" opacity="0.55"/>
  <circle cx="93"  cy="102" r="1.5" fill="#FF2A2A" opacity="0.3"/>
  <circle cx="107" cy="92"  r="1.5" fill="#FF2A2A" opacity="0.8" filter="url(#softglow)"/>
  <circle cx="107" cy="97"  r="1.5" fill="#FF2A2A" opacity="0.55"/>
  <circle cx="107" cy="102" r="1.5" fill="#FF2A2A" opacity="0.3"/>

  <!-- ═══════════════════════════ -->
  <!--       BRAND TEXT           -->
  <!-- ═══════════════════════════ -->

  <!-- GoXPrint -->
  <text x="100" y="176" font-size="22" font-weight="800"
        font-family="'Segoe UI', Arial, sans-serif"
        text-anchor="middle" letter-spacing="-0.5">
    <tspan fill="white">Go</tspan><tspan fill="url(#redGrad)" filter="url(#softglow)">X</tspan><tspan fill="white">Print</tspan>
  </text>

  <!-- Red underline -->
  <rect x="46" y="180" width="108" height="3" rx="1.5" fill="url(#redHoriz)" opacity="0.95"/>
  <rect x="46" y="180" width="108" height="3" rx="1.5" fill="url(#redHoriz)" opacity="0.4" filter="url(#softglow)"/>

  <!-- Tagline -->
  <text x="100" y="194" font-size="7.5" font-weight="500"
        font-family="'Segoe UI', Arial, sans-serif"
        text-anchor="middle" letter-spacing="2.8" fill="#FF2A2A" opacity="0.65">AI · AUTO · SMART</text>

</svg>
